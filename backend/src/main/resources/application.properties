spring.application.name=Pet Vaccination Tracker API
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5433/pet_tracker}
spring.datasource.username=${DB_USERNAME:pet_tracker}
spring.datasource.password=${DB_PASSWORD:local-dev-only}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.validate-migration-naming=true
app.jwt.secret=${JWT_SECRET:development-only-change-this-secret-to-a-long-random-value}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.storage.certificates-dir=${CERTIFICATES_DIR:./uploads/certificates}
app.extraction.tessdata-dir=${TESSDATA_DIR:./tessdata}

# Missing/unavailable SMTP prints prepared reminders instead of failing.
app.reminders.enabled=${REMINDERS_ENABLED:true}
management.health.mail.enabled=false
app.reminders.trigger-key=${REMINDER_TRIGGER_KEY:}
app.reminders.cron=${REMINDER_CRON:0 0 9 * * *}
app.reminders.zone=${REMINDER_ZONE:Asia/Kolkata}
app.reminders.from=${REMINDER_FROM:}
app.reminders.app-url=${APP_URL:http://localhost:4200}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
